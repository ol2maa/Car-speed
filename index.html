<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">
<title>اختبار الصوت</title>

<style>
body {
    margin: 0;
    background: #78b85a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial;
}

button {
    font-size: 28px;
    padding: 25px 45px;
    border-radius: 20px;
    border: 4px solid white;
    background: #222;
    color: white;
}
</style>
</head>

<body>

<button id="soundButton">
🔊 تشغيل صوت المحرك
</button>

<audio
    id="engine"
    preload="auto"
    playsinline
    webkit-playsinline
    loop>
</audio>

<script>

const audio = document.getElementById("engine");

audio.src = "./Fast-car-sound-effect.mp3";

audio.loop = true;

audio.volume = 1.0;


document
.getElementById("soundButton")
.addEventListener("touchstart", function(e) {

    e.preventDefault();

    audio.currentTime = 0;

    audio.volume = 1.0;

    audio.play()
    .then(function() {

        document.getElementById("soundButton").textContent =
            "🔊 الصوت يعمل";

    })
    .catch(function(error) {

        document.getElementById("soundButton").textContent =
            "❌ لم يعمل الصوت";

        console.log(error);

    });

}, {passive:false});


document
.getElementById("soundButton")
.addEventListener("click", function() {

    audio.currentTime = 0;

    audio.volume = 1.0;

    audio.play()
    .then(function() {

        document.getElementById("soundButton").textContent =
            "🔊 الصوت يعمل";

    })
    .catch(function(error) {

        document.getElementById("soundButton").textContent =
            "❌ لم يعمل الصوت";

        console.log(error);

    });

});

</script>

</body>
</html>
