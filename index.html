<body>

<canvas id="game"></canvas>

<script>

"use strict";


// ============================================================
// Canvas
// ============================================================

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;


// ============================================================
// نظام صوت سيارة اللاعب فقط
// ============================================================

let audioCtx = null;

let engineOsc1 = null;
let engineOsc2 = null;
let engineOsc3 = null;

let engineGain = null;

let engineFilter = null;

let engineStarted = false;


// ============================================================
// إنشاء نظام صوت المحرك
// ============================================================

function initEngineSound() {

    if (engineStarted) {
        return;
    }

    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass) {
            return;
        }

        if (!audioCtx) {

            audioCtx =
                new AudioContextClass();
        }


        // ----------------------------------------------------
        // المحرك الرئيسي
        // ----------------------------------------------------

        engineGain =
            audioCtx.createGain();

        engineGain.gain.value =
            0;


        // ----------------------------------------------------
        // فلتر
        // ----------------------------------------------------

        engineFilter =
            audioCtx.createBiquadFilter();

        engineFilter.type =
            "lowpass";

        engineFilter.frequency.value =
            1200;

        engineFilter.Q.value =
            1;


        // ----------------------------------------------------
        // Oscillator 1
        // ----------------------------------------------------

        engineOsc1 =
            audioCtx.createOscillator();

        engineOsc1.type =
            "sawtooth";

        engineOsc1.frequency.value =
            80;


        const gain1 =
            audioCtx.createGain();

        gain1.gain.value =
            0.32;


        // ----------------------------------------------------
        // Oscillator 2
        // ----------------------------------------------------

        engineOsc2 =
            audioCtx.createOscillator();

        engineOsc2.type =
            "square";

        engineOsc2.frequency.value =
            160;


        const gain2 =
            audioCtx.createGain();

        gain2.gain.value =
            0.08;


        // ----------------------------------------------------
        // Oscillator 3
        // ----------------------------------------------------

        engineOsc3 =
            audioCtx.createOscillator();

        engineOsc3.type =
            "triangle";

        engineOsc3.frequency.value =
            40;


        const gain3 =
            audioCtx.createGain();

        gain3.gain.value =
            0.25;


        // ----------------------------------------------------
        // التوصيل
        // ----------------------------------------------------

        engineOsc1.connect(gain1);

        engineOsc2.connect(gain2);

        engineOsc3.connect(gain3);

        gain1.connect(engineFilter);

        gain2.connect(engineFilter);

        gain3.connect(engineFilter);

        engineFilter.connect(engineGain);

        engineGain.connect(
            audioCtx.destination
        );


        // ----------------------------------------------------
        // تشغيل الأصوات
        // ----------------------------------------------------

        engineOsc1.start();

        engineOsc2.start();

        engineOsc3.start();


        engineStarted = true;


        if (
            audioCtx.state === "suspended"
        ) {

            audioCtx.resume();
        }

    }
    catch (error) {

        console.log(
            "Engine audio error:",
            error
        );
    }
}


// ============================================================
// تشغيل المحرك من ضغط المستخدم
// ============================================================

function startEngineSound() {

    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass) {
            return;
        }


        if (!audioCtx) {

            audioCtx =
                new AudioContextClass();
        }


        // ----------------------------------------------------
        // تشغيل AudioContext مباشرة من اللمسة
        // ----------------------------------------------------

        if (
            audioCtx.state === "suspended"
        ) {

            audioCtx.resume();
        }


        // ----------------------------------------------------
        // إنشاء المحرك
        // ----------------------------------------------------

        initEngineSound();


        if (
            audioCtx.state === "suspended"
        ) {

            audioCtx.resume();
        }

    }
    catch (error) {

        console.log(
            "Audio start error:",
            error
        );
    }
}


// ============================================================
// تحديث صوت المحرك
// ============================================================

function updateEngineSound() {

    if (
        !engineStarted ||
        !audioCtx ||
        !engineGain
    ) {

        return;
    }


    const now =
        audioCtx.currentTime;


    // --------------------------------------------------------
    // السيارة متوقفة
    // --------------------------------------------------------

    if (
        game.finished ||
        game.collisionLocked ||
        game.speed <= 0
    ) {

        engineGain.gain.setTargetAtTime(
            0,
            now,
            0.08
        );

        return;
    }


    // --------------------------------------------------------
    // السرعة
    // --------------------------------------------------------

    const speed =
        clamp(
            game.speed,
            0,
            game.maxSpeed
        );


    // --------------------------------------------------------
    // تردد المحرك
    // --------------------------------------------------------

    const baseFrequency =
        65 +
        speed * 1.55;


    engineOsc1.frequency.setTargetAtTime(
        baseFrequency,
        now,
        0.04
    );


    engineOsc2.frequency.setTargetAtTime(
        baseFrequency * 2,
        now,
        0.04
    );


    engineOsc3.frequency.setTargetAtTime(
        baseFrequency * 0.5,
        now,
        0.04
    );


    // --------------------------------------------------------
    // مستوى الصوت
    // --------------------------------------------------------

    const ratio =
        speed / game.maxSpeed;


    const volume =
        0.08 +
        ratio * 0.20;


    engineGain.gain.setTargetAtTime(
        volume,
        now,
        0.05
    );


    // --------------------------------------------------------
    // الفلتر
    // --------------------------------------------------------

    const filterFrequency =
        700 +
        speed * 8;


    engineFilter.frequency.setTargetAtTime(
        filterFrequency,
        now,
        0.05
    );
}


// ============================================================
// مستطيل مدور
// ============================================================

function drawRoundedRect(
    x,
    y,
    w,
    h,
    r,
    fill,
    stroke,
    lineWidth = 1
) {

    ctx.beginPath();

    ctx.moveTo(
        x + r,
        y
    );

    ctx.lineTo(
        x + w - r,
        y
    );

    ctx.quadraticCurveTo(
        x + w,
        y,
        x + w,
        y + r
    );

    ctx.lineTo(
        x + w,
        y + h - r
    );

    ctx.quadraticCurveTo(
        x + w,
        y + h,
        x + w - r,
        y + h
    );

    ctx.lineTo(
        x + r,
        y + h
    );

    ctx.quadraticCurveTo(
        x,
        y + h,
        x,
        y + h - r
    );

    ctx.lineTo(
        x,
        y + r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + r,
        y
    );

    ctx.closePath();

    if (fill) {

        ctx.fillStyle =
            fill;

        ctx.fill();
    }

    if (stroke) {

        ctx.strokeStyle =
            stroke;

        ctx.lineWidth =
            lineWidth;

        ctx.stroke();
    }
}


// ============================================================
// إعدادات اللعبة
// ============================================================

const game = {

    speed: 60,

    minSpeed: 0,

    maxSpeed: 300,

    speedStep: 10,

    speedMotion: 240,

    distance: 0,

    maxDistance: 5,

    elapsed: 0,

    collisions: 0,

    finished: false,

    finishActive: false,

    finishY: -28,

    finishHeight: 28,

    playerX: 0,

    playerY: 0,

    carWidth: 46,

    carHeight: 72,

    roadWidth: 280,

    lineWidth: 8,

    lineHeight: 45,

    lineSpacing: 90,

    lines: [],

    trees: [],

    traffic: [],

    trafficCount: 8,

    trafficColors: [

        "#1976d2",
        "#f5c400",
        "#eeeeee",
        "#43a047",
        "#8e44ad",
        "#ff7043",
        "#00acc1",
        "#d32f2f"
    ],

    trafficLanes: [],

    moveLeft: false,

    moveRight: false,

    speedUpHeld: false,

    speedDownHeld: false,

    speedHoldTimer: 0,

    speedHoldInterval: 0.08,

    collisionLocked: false,

    collisionTimer: 0,

    collisionLockTime: 2,

    collisionCooldown: 0,

    flashTimer: 0,

    flashOn: true,

    savedCarX: 0,

    carRotation: 0,

    targetRotation: 0,

    lastTime: performance.now()
};


// ============================================================
// مسافات سيارات المرور
// ============================================================

const TRAFFIC_SAFE_GAP = 110;

const TRAFFIC_RESPAWN_GAP = 260;


// ============================================================
// تغيير الحجم
// ============================================================

function resize() {

    let width =
        window.innerWidth;

    let height =
        window.innerHeight;


    if (window.visualViewport) {

        width =
            window.visualViewport.width;

        height =
            window.visualViewport.height;
    }


    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    W = width;

    H = height;


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    canvas.width =
        Math.floor(
            W * dpr
        );

    canvas.height =
        Math.floor(
            H * dpr
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    game.playerY =
        playerY();


    game.trafficLanes = [

        W / 2 - 75,

        W / 2,

        W / 2 + 75
    ];


    if (
        !game.finished &&
        !game.collisionLocked
    ) {

        const leftLimit =
            roadLeft() +
            game.carWidth / 2 +
            5;


        const rightLimit =
            roadRight() -
            game.carWidth / 2 -
            5;


        game.playerX =
            clamp(
                game.playerX,
                leftLimit,
                rightLimit
            );
    }
}


// ============================================================
// Fullscreen
// ============================================================

function requestGameFullscreen() {

    const el =
        document.documentElement;


    if (
        window.matchMedia &&
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches
    ) {

        return;
    }


    if (
        el.requestFullscreen &&
        !document.fullscreenElement
    ) {

        el.requestFullscreen()
            .catch(() => {});
    }
}


document.addEventListener(
    "touchstart",
    requestGameFullscreen,
    {
        once: true,
        passive: true
    }
);


// ============================================================
// حدود الطريق
// ============================================================

function roadLeft() {

    return (
        W / 2 -
        game.roadWidth / 2
    );
}


function roadRight() {

    return (
        W / 2 +
        game.roadWidth / 2
    );
}


// ============================================================
// مكان السيارة
// ============================================================

function playerY() {

    const bottomSafe = 18;


    const directionButtonY =
        H -
        bottomSafe -
        22;


    return (
        directionButtonY -
        game.carHeight / 2 -
        72
    );
}


// ============================================================
// أدوات مساعدة
// ============================================================

function clamp(v, a, b) {

    return Math.max(
        a,
        Math.min(b, v)
    );
}


function rand(a, b) {

    return (
        a +
        Math.random() *
        (b - a)
    );
}


function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        sec.toFixed(2).padStart(5, "0")
    );
}


// ============================================================
// متوسط السرعة
// ============================================================

function getAverageSpeed() {

    if (
        game.elapsed <= 0
    ) {

        return 0;
    }


    return (
        game.distance /
        (game.elapsed / 3600)
    );
}


// ============================================================
// رسم الشجرة
// ============================================================

function drawTree(x, y) {

    ctx.fillStyle =
        "#7b4b27";


    ctx.fillRect(
        x - 6,
        y,
        12,
        35
    );


    ctx.beginPath();


    ctx.ellipse(
        x,
        y + 30,
        24,
        27.5,
        0,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#176b2c";


    ctx.fill();
}


// ============================================================
// رسم السيارة
// ============================================================

function drawCar(
    x,
    y,
    w,
    h,
    color,
    angle = 0,
    isPlayer = false,
    alpha = 1
) {

    ctx.save();


    ctx.globalAlpha =
        alpha;


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        angle
    );


    drawRoundedRect(
        -w / 2,
        -h / 2,
        w,
        h,
        8,
        color,
        "#ffffff",
        isPlayer ? 3 : 2
    );


    const windowW = 32;

    const windowH = 22;


    drawRoundedRect(
        -windowW / 2,
        -h / 2 + 5,
        windowW,
        windowH,
        5,
        "#8ed0e8",
        "#333333",
        1
    );


    ctx.restore();
}


// ============================================================
// رسم الزر
// ============================================================

function drawButton(
    x,
    y,
    text
) {

    drawRoundedRect(
        x - 22,
        y - 22,
        44,
        44,
        9,
        "#222222",
        "#ffffff",
        2
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold 23px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        text,
        x,
        y + 1
    );
}


// ============================================================
// مواقع الأزرار
// ============================================================

function getButtonPositions() {

    const bottomSafe = 18;


    const directionY =
        H -
        bottomSafe -
        22;


    const speedDownY =
        H -
        bottomSafe -
        22;


    const speedUpY =
        speedDownY -
        52;


    return {

        directionLeftX:
            W - 95,

        directionRightX:
            W - 43,

        directionY:
            directionY,

        speedX:
            35,

        speedUpY:
            speedUpY,

        speedDownY:
            speedDownY
    };
}


// ============================================================
// رسم الطريق
// ============================================================

function drawRoad() {

    ctx.fillStyle =
        "#78b85a";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle =
        "#555555";


    ctx.fillRect(
        roadLeft(),
        0,
        game.roadWidth,
        H
    );


    for (
        const y of game.lines
    ) {

        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            W / 2 -
            game.lineWidth / 2,
            y,
            game.lineWidth,
            game.lineHeight
        );
    }


    for (
        const t of game.trees
    ) {

        drawTree(
            t.x,
            t.y
        );
    }


    if (
        game.finishActive
    ) {

        const squareRows = 2;

        const squareCols = 12;


        const squareWidth =
            game.roadWidth /
            squareCols;


        const rowHeight =
            game.finishHeight /
            squareRows;


        const left =
            roadLeft();


        for (
            let row = 0;
            row < squareRows;
            row++
        ) {

            for (
                let col = 0;
                col < squareCols;
                col++
            ) {

                ctx.fillStyle =
                    (
                        (row + col) % 2 === 0
                    )
                    ? "#ffffff"
                    : "#000000";


                ctx.fillRect(
                    left +
                    col *
                    squareWidth,

                    game.finishY +
                    row *
                    rowHeight,

                    squareWidth + 1,

                    rowHeight + 1
                );
            }
        }
    }
}


// ============================================================
// واجهة اللعبة
// ============================================================

function drawUI() {

    drawRoundedRect(
        15,
        17,
        94,
        42,
        7,
        "#000000",
        "#ffffff",
        1
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold 15px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        game.distance.toFixed(3) +
        " كم",
        62,
        38
    );


    drawRoundedRect(
        15,
        65,
        94,
        42,
        7,
        "#000000",
        "#ffffff",
        1
    );


    ctx.fillStyle =
        "#ffff00";


    ctx.font =
        "bold 13px Arial";


    ctx.fillText(
        formatTime(
            game.elapsed
        ),
        62,
        86
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "42px Arial";


    ctx.fillText(
        "×",
        W - 35,
        35
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold 18px Arial";


    ctx.shadowColor =
        "#000000";


    ctx.shadowOffsetY =
        -1;


    const speedText =
        game.collisionLocked
        ? "0"
        : String(
            Math.floor(
                game.speed
            )
        );


    ctx.fillText(
        speedText,
        game.playerX,
        game.playerY + 28
    );


    ctx.shadowColor =
        "transparent";


    ctx.shadowOffsetY =
        0;


    const buttons =
        getButtonPositions();


    drawButton(
        buttons.directionLeftX,
        buttons.directionY,
        "◀"
    );


    drawButton(
        buttons.directionRightX,
        buttons.directionY,
        "▶"
    );


    drawButton(
        buttons.speedX,
        buttons.speedUpY,
        "↑"
    );


    drawButton(
        buttons.speedX,
        buttons.speedDownY,
        "↓"
    );


    if (
        game.finished
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,0.72)";


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "bold 28px Arial";


        ctx.fillText(
            game.distance >=
            game.maxDistance
            ? "تم إنهاء 5 كم"
            : "تم إنهاء اللعبة",

            W / 2,
            H / 2 - 90
        );


        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "bold 19px Arial";


        ctx.fillText(
            "المسافة: " +
            game.distance.toFixed(3) +
            " كم",

            W / 2,
            H / 2 - 52
        );


        ctx.fillStyle =
            "#ffff00";


        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "الوقت: " +
            formatTime(
                game.elapsed
            ),

            W / 2,
            H / 2 - 17
        );


        ctx.fillStyle =
            "#00e5ff";


        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "متوسط السرعة: " +
            getAverageSpeed().toFixed(2) +
            " كم/ساعة",

            W / 2,
            H / 2 + 22
        );


        ctx.fillStyle =
            "#ff7043";


        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "عدد الصدمات: " +
            game.collisions,

            W / 2,
            H / 2 + 61
        );


        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "18px Arial";


        ctx.fillText(
            "اضغط X لإعادة اللعب",

            W / 2,
            H / 2 + 105
        );
    }
}


// ============================================================
// سيارة المرور
// ============================================================

function createTrafficCar(
    x,
    y,
    color,
    speed,
    lane
) {

    return {

        x: x,

        y: y,

        width: 46,

        height: 72,

        color: color,

        baseSpeed: speed,

        currentSpeed: speed,

        lane: lane,

        avoiding: false,

        timer: 0
    };
}


// ============================================================
// شجرة
// ============================================================

function createTree(
    side,
    y
) {

    const x =
        W / 2 +
        side *
        (
            game.roadWidth / 2 +
            45 +
            rand(-15, 25)
        );


    return {

        side: side,

        x: x,

        y: y
    };
}


// ============================================================
// إعادة العالم
// ============================================================

function resetWorld() {

    game.playerX =
        W / 2;


    game.playerY =
        playerY();


    game.carRotation = 0;

    game.targetRotation = 0;


    game.savedCarX =
        game.playerX;


    game.lines = [];


    const lineCount =
        Math.ceil(
            H /
            game.lineSpacing
        ) + 5;


    for (
        let i = 0;
        i < lineCount;
        i++
    ) {

        game.lines.push(
            i *
            game.lineSpacing -
            100
        );
    }


    game.trees = [];


    for (
        const side of [-1, 1]
    ) {

        for (
            let y = -80;
            y < H + 200;
            y += 120
        ) {

            game.trees.push(
                createTree(
                    side,
                    y
                )
            );
        }
    }


    game.trafficLanes = [

        W / 2 - 75,

        W / 2,

        W / 2 + 75
    ];


    game.traffic = [];


    for (
        let i = 0;
        i < game.trafficCount;
        i++
    ) {

        const speedOptions = [

            rand(20, 40),

            rand(40, 70),

            rand(70, 100)
        ];


        const speed =
            speedOptions[
                Math.floor(
                    Math.random() *
                    speedOptions.length
                )
            ];


        const lane =
            i % 3;


        const x =
            game.trafficLanes[
                lane
            ];


        const y =
            -180 -
            i * 180 +
            rand(-20, 20);


        const color =
            game.trafficColors[
                i %
                game.trafficColors.length
            ];


        game.traffic.push(
            createTrafficCar(
                x,
                y,
                color,
                speed,
                lane
            )
        );
    }
}


// ============================================================
// أقرب سيارة أمام سيارة معينة
// ============================================================

function getCarAhead(car) {

    let nearest = null;

    let nearestGap =
        Infinity;


    for (
        const other of game.traffic
    ) {

        if (
            other === car ||
            other.lane !== car.lane
        ) {

            continue;
        }


        const gap =
            other.y -
            car.y;


        if (
            gap > 0 &&
            gap < nearestGap
        ) {

            nearestGap =
                gap;

            nearest =
                other;
        }
    }


    return {

        car: nearest,

        gap: nearestGap
    };
}


// ============================================================
// منع تداخل سيارات المرور
// ============================================================

function separateTrafficCars() {

    for (
        let lane = 0;
        lane < 3;
        lane++
    ) {

        const cars =
            game.traffic
                .filter(
                    car =>
                        car.lane === lane
                )
                .sort(
                    (a, b) =>
                        a.y - b.y
                );


        for (
            let i = 1;
            i < cars.length;
            i++
        ) {

            const front =
                cars[i - 1];

            const back =
                cars[i];


            const requiredGap =
                Math.max(
                    TRAFFIC_SAFE_GAP,
                    (
                        front.height +
                        back.height
                    ) / 2 +
                    25
                );


            const actualGap =
                back.y -
                front.y;


            if (
                actualGap <
                requiredGap
            ) {

                back.y =
                    front.y +
                    requiredGap;
            }
        }
    }
}


// ============================================================
// تحديث اللعبة
// ============================================================

function update(dt) {

    if (
        dt > 0.05
    ) {

        dt = 0.05;
    }


    // صوت السيارة الحمراء فقط
    updateEngineSound();


    // --------------------------------------------------------
    // الوقت
    // --------------------------------------------------------

    if (
        !game.finished
    ) {

        game.elapsed += dt;
    }


    // --------------------------------------------------------
    // التحكم بالسرعة
    // --------------------------------------------------------

    if (
        !game.collisionLocked &&
        !game.finished
    ) {

        if (
            game.speedUpHeld ||
            game.speedDownHeld
        ) {

            game.speedHoldTimer += dt;


            while (
                game.speedHoldTimer >=
                game.speedHoldInterval
            ) {

                game.speedHoldTimer -=
                    game.speedHoldInterval;


                if (
                    game.speedUpHeld &&
                    !game.speedDownHeld
                ) {

                    game.speed =
                        Math.min(
                            game.maxSpeed,
                            game.speed +
                            game.speedStep
                        );
                }

                else if (
                    game.speedDownHeld &&
                    !game.speedUpHeld
                ) {

                    game.speed =
                        Math.max(
                            game.minSpeed,
                            game.speed -
                            game.speedStep
                        );
                }


                game.speedMotion =
                    game.speed * 4;


                if (
                    game.speed <= 0
                ) {

                    game.speed = 0;

                    game.speedMotion = 0;

                    game.moveLeft = false;

                    game.moveRight = false;

                    game.carRotation = 0;
                }
            }
        }
    }


    // --------------------------------------------------------
    // المسافة
    // --------------------------------------------------------

    if (
        !game.finished
    ) {

        if (
            !game.finishActive
        ) {

            game.distance +=
                (
                    game.speed *
                    dt
                ) / 3600;
        }


        if (
            game.distance >=
            game.maxDistance &&
            !game.finishActive
        ) {

            game.distance =
                game.maxDistance;


            game.finishActive =
                true;


            game.finishY =
                -game.finishHeight;


            game.moveLeft = false;

            game.moveRight = false;

            game.speedUpHeld = false;

            game.speedDownHeld = false;

            game.speedHoldTimer = 0;
        }
    }


    // --------------------------------------------------------
    // النهاية
    // --------------------------------------------------------

    if (
        game.finished
    ) {

        game.speed = 0;

        game.speedMotion = 0;

        game.moveLeft = false;

        game.moveRight = false;

        game.speedUpHeld = false;

        game.speedDownHeld = false;

        game.speedHoldTimer = 0;

        return;
    }


    // --------------------------------------------------------
    // فترة التصادم
    // --------------------------------------------------------

    if (
        game.collisionCooldown > 0
    ) {

        game.collisionCooldown =
            Math.max(
                0,
                game.collisionCooldown -
                dt
            );
    }


    if (
        game.collisionLocked
    ) {

        game.speed = 0;

        game.speedMotion = 0;

        game.collisionTimer -= dt;

        game.moveLeft = false;

        game.moveRight = false;


        game.playerX =
            game.savedCarX;


        game.flashTimer += dt;


        if (
            game.flashTimer >=
            0.15
        ) {

            game.flashTimer = 0;

            game.flashOn =
                !game.flashOn;
        }


        if (
            game.collisionTimer <= 0
        ) {

            game.collisionLocked =
                false;

            game.flashOn = true;

            game.collisionCooldown =
                0.25;

            game.carRotation = 0;

            game.targetRotation = 0;
        }


        return;
    }


    // --------------------------------------------------------
    // حركة الطريق
    // --------------------------------------------------------

    const move =
        game.speedMotion *
        dt;


    const totalSpan =
        game.lines.length *
        game.lineSpacing;


    for (
        let i = 0;
        i < game.lines.length;
        i++
    ) {

        game.lines[i] += move;


        if (
            game.lines[i] >
            H + 100
        ) {

            game.lines[i] -=
                totalSpan;
        }
    }


    // --------------------------------------------------------
    // خط النهاية
    // --------------------------------------------------------

    if (
        game.finishActive &&
        !game.finished
    ) {

        const finishSpeed =
            Math.max(
                180,
                Math.abs(
                    game.speedMotion
                )
            );


        game.finishY +=
            finishSpeed * dt;


        const carFrontY =
            game.playerY -
            game.carHeight / 2;


        if (
            game.finishY +
            game.finishHeight >=
            carFrontY
        ) {

            game.finishY =
                carFrontY -
                game.finishHeight;


            game.finished = true;

            game.speed = 0;

            game.speedMotion = 0;

            game.moveLeft = false;

            game.moveRight = false;

            game.speedUpHeld = false;

            game.speedDownHeld = false;

            game.speedHoldTimer = 0;
        }
    }


    // --------------------------------------------------------
    // الأشجار
    // --------------------------------------------------------

    for (
        const t of game.trees
    ) {

        t.y += move;


        if (
            t.y >
            H + 100
        ) {

            t.y =
                -100 +
                rand(-30, 30);
        }
    }


    // --------------------------------------------------------
    // سيارات المرور
    // --------------------------------------------------------

    for (
        const t of game.traffic
    ) {

        if (
            !t.avoiding
        ) {

            t.currentSpeed =
                t.baseSpeed;
        }


        t.timer += dt;


        if (
            t.timer > 5
        ) {

            t.timer = 0;


            const change =
                rand(
                    -0.08,
                    0.08
                );


            t.baseSpeed =
                clamp(
                    t.baseSpeed *
                    (1 + change),
                    20,
                    120
                );
        }


        const ahead =
            getCarAhead(t);


        if (
            ahead.car &&
            ahead.gap <
            TRAFFIC_SAFE_GAP + 60
        ) {

            t.avoiding = true;


            const factor =
                clamp(
                    (
                        ahead.gap -
                        60
                    ) /
                    (
                        TRAFFIC_SAFE_GAP -
                        60
                    ),
                    0.05,
                    1
                );


            t.currentSpeed =
                t.baseSpeed *
                factor;

        }

        else {

            t.avoiding = false;


            t.currentSpeed +=
                (
                    t.baseSpeed -
                    t.currentSpeed
                ) *
                Math.min(
                    1,
                    dt * 2
                );
        }


        const relativeSpeed =
            game.speed -
            t.currentSpeed;


        t.y +=
            relativeSpeed *
            4 *
            dt;
    }


    separateTrafficCars();


    // --------------------------------------------------------
    // إعادة سيارات المرور
    // --------------------------------------------------------

    for (
        const t of game.traffic
    ) {

        if (
            t.y >
            H + 140
        ) {

            const laneCounts =
                game.trafficLanes.map(
                    (_, laneIndex) => {

                        return game.traffic.filter(
                            o =>
                                o !== t &&
                                o.lane === laneIndex &&
                                o.y < H + 100
                        ).length;
                    }
                );


            let newLane =
                laneCounts.indexOf(
                    Math.min(
                        ...laneCounts
                    )
                );


            if (
                newLane < 0
            ) {

                newLane =
                    Math.floor(
                        Math.random() * 3
                    );
            }


            const laneCars =
                game.traffic.filter(
                    o =>
                        o !== t &&
                        o.lane === newLane
                );


            let spawnY =
                -game.carHeight -
                rand(80, 180);


            if (
                laneCars.length > 0
            ) {

                const highestY =
                    Math.min(
                        ...laneCars.map(
                            o => o.y
                        )
                    );


                const candidate =
                    highestY -
                    TRAFFIC_RESPAWN_GAP -
                    rand(30, 100);


                spawnY =
                    Math.min(
                        spawnY,
                        candidate,
                        -game.carHeight - 30
                    );
            }


            const speedOptions = [

                rand(20, 40),

                rand(40, 70),

                rand(70, 100)
            ];


            t.lane =
                newLane;


            t.baseSpeed =
                speedOptions[
                    Math.floor(
                        Math.random() *
                        speedOptions.length
                    )
                ];


            t.currentSpeed =
                t.baseSpeed;


            t.avoiding =
                false;


            t.timer =
                0;


            t.x =
                game.trafficLanes[
                    newLane
                ];


            t.y =
                spawnY;
        }
    }


    separateTrafficCars();


    // --------------------------------------------------------
    // فحص التصادم
    // --------------------------------------------------------

    if (
        !game.collisionLocked &&
        game.collisionCooldown <= 0
    ) {

        checkCollisions();
    }


    // --------------------------------------------------------
    // حركة السيارة
    // --------------------------------------------------------

    if (
        game.speed > 0 &&
        !game.collisionLocked
    ) {

        if (
            game.moveLeft
        ) {

            game.targetRotation =
                -0.12;

        }

        else if (
            game.moveRight
        ) {

            game.targetRotation =
                0.12;

        }

        else {

            game.targetRotation =
                0;
        }


        const lateralSpeed =
            190;


        let direction = 0;


        if (
            game.moveLeft
        ) {

            direction = -1;
        }


        if (
            game.moveRight
        ) {

            direction = 1;
        }


        let newX =
            game.playerX +
            direction *
            lateralSpeed *
            dt;


        const leftLimit =
            roadLeft() +
            game.carWidth / 2 +
            5;


        const rightLimit =
            roadRight() -
            game.carWidth / 2 -
            5;


        game.playerX =
            clamp(
                newX,
                leftLimit,
                rightLimit
            );


        game.carRotation +=
            (
                game.targetRotation -
                game.carRotation
            ) *
            Math.min(
                1,
                dt * 10
            );

    }

    else {

        game.carRotation = 0;
    }
}


// ============================================================
// فحص التصادم
// ============================================================

function checkCollisions() {

    const px =
        game.playerX;

    const py =
        game.playerY;


    const pHalfW =
        game.carWidth / 2;

    const pHalfH =
        game.carHeight / 2;


    for (
        const t of game.traffic
    ) {

        const dx =
            Math.abs(
                px - t.x
            );


        const dy =
            Math.abs(
                py - t.y
            );


        const oHalfW =
            t.width / 2;

        const oHalfH =
            t.height / 2;


        if (
            dx <
            pHalfW +
            oHalfW +
            4
            &&
            dy <
            pHalfH +
            oHalfH +
            6
        ) {

            startCollision(t);

            return;
        }
    }
}


// ============================================================
// بدء التصادم
// ============================================================

function startCollision(t) {

    game.collisions += 1;


    game.speed = 0;

    game.speedMotion = 0;


    game.collisionLocked =
        true;


    game.collisionTimer =
        game.collisionLockTime;


    game.flashTimer = 0;

    game.flashOn = true;


    game.moveLeft = false;

    game.moveRight = false;

    game.speedUpHeld = false;

    game.speedDownHeld = false;

    game.speedHoldTimer = 0;


    game.savedCarX =
        game.playerX;


    t.y -= 95;
}


// ============================================================
// إعادة اللعب
// ============================================================

function restart() {

    game.speed = 60;

    game.distance = 0;

    game.elapsed = 0;

    game.collisions = 0;

    game.finished = false;

    game.finishActive = false;

    game.finishY =
        -game.finishHeight;

    game.moveLeft = false;

    game.moveRight = false;

    game.speedUpHeld = false;

    game.speedDownHeld = false;

    game.speedHoldTimer = 0;

    game.collisionLocked = false;

    game.collisionTimer = 0;

    game.collisionCooldown = 0;

    game.flashTimer = 0;

    game.flashOn = true;

    game.speedMotion =
        game.speed * 4;


    activeTouches.clear();


    resetWorld();


    startEngineSound();
}


// ============================================================
// الرسم
// ============================================================

function draw() {

    drawRoad();


    // سيارات المرور
    for (
        const t of game.traffic
    ) {

        drawCar(
            t.x,
            t.y,
            t.width,
            t.height,
            t.color
        );
    }


    // سيارة اللاعب
    const alpha =
        game.collisionLocked &&
        !game.flashOn
        ? 0.45
        : 1;


    drawCar(
        game.playerX,
        game.playerY,
        game.carWidth,
        game.carHeight,
        "#e53935",
        game.carRotation,
        true,
        alpha
    );


    drawUI();
}


// ============================================================
// الحلقة الرئيسية
// ============================================================

function loop(now) {

    let dt =
        (
            now -
            game.lastTime
        ) / 1000;


    game.lastTime =
        now;


    if (
        !Number.isFinite(dt) ||
        dt > 0.05
    ) {

        dt = 0.05;
    }


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


// ============================================================
// Multi-Touch
// ============================================================

const activeTouches =
    new Map();


// ============================================================
// نقطة اللمس
// ============================================================

function getTouchPoint(touch) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            touch.clientX -
            rect.left,

        y:
            touch.clientY -
            rect.top
    };
}


// ============================================================
// منطقة لمس الزر
// ============================================================

function isButtonHit(
    x,
    y,
    cx,
    cy
) {

    return (

        Math.abs(
            x - cx
        ) <= 27

        &&

        Math.abs(
            y - cy
        ) <= 27
    );
}


// ============================================================
// تحديد الزر
// ============================================================

function getTouchedButton(
    x,
    y
) {

    const buttons =
        getButtonPositions();


    if (
        isButtonHit(
            x,
            y,
            buttons.directionLeftX,
            buttons.directionY
        )
    ) {

        return "left";
    }


    if (
        isButtonHit(
            x,
            y,
            buttons.directionRightX,
            buttons.directionY
        )
    ) {

        return "right";
    }


    if (
        isButtonHit(
            x,
            y,
            buttons.speedX,
            buttons.speedUpY
        )
    ) {

        return "speedUp";
    }


    if (
        isButtonHit(
            x,
            y,
            buttons.speedX,
            buttons.speedDownY
        )
    ) {

        return "speedDown";
    }


    return null;
}


// ============================================================
// تحديث اللمسات
// ============================================================

function updateTouchControls() {

    let left = false;

    let right = false;

    let speedUp = false;

    let speedDown = false;


    for (
        const button of
        activeTouches.values()
    ) {

        if (
            button === "left"
        ) {

            left = true;

        }

        else if (
            button === "right"
        ) {

            right = true;

        }

        else if (
            button === "speedUp"
        ) {

            speedUp = true;

        }

        else if (
            button === "speedDown"
        ) {

            speedDown = true;
        }
    }


    game.moveLeft =
        left && !right;


    game.moveRight =
        right && !left;


    game.speedUpHeld =
        speedUp && !speedDown;


    game.speedDownHeld =
        speedDown && !speedUp;


    if (
        !game.speedUpHeld &&
        !game.speedDownHeld
    ) {

        game.speedHoldTimer = 0;
    }
}


// ============================================================
// Touch Start
// ============================================================

canvas.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();


        // ====================================================
        // مهم جدًا:
        // تشغيل الصوت مباشرة من حدث اللمس
        // ====================================================

        startEngineSound();


        for (
            const touch of
            e.changedTouches
        ) {

            const p =
                getTouchPoint(
                    touch
                );


            // ------------------------------------------------
            // زر X
            // ------------------------------------------------

            if (
                p.x > W - 90 &&
                p.y < 90
            ) {

                if (
                    game.finished
                ) {

                    restart();

                }

                else {

                    game.finished = true;

                    game.speed = 0;

                    game.speedMotion = 0;

                    game.moveLeft = false;

                    game.moveRight = false;

                    game.speedUpHeld = false;

                    game.speedDownHeld = false;

                    game.speedHoldTimer = 0;

                    game.collisionLocked = false;

                    game.collisionTimer = 0;

                    game.collisionCooldown = 0;

                    activeTouches.clear();
                }

                continue;
            }


            if (
                game.finished
            ) {

                continue;
            }


            const button =
                getTouchedButton(
                    p.x,
                    p.y
                );


            if (
                button
            ) {

                activeTouches.set(
                    touch.identifier,
                    button
                );
            }
        }


        updateTouchControls();

    },
    {
        passive: false
    }
);


// ============================================================
// Touch Move
// ============================================================

canvas.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();


        for (
            const touch of
            e.changedTouches
        ) {

            if (
                !activeTouches.has(
                    touch.identifier
                )
            ) {

                continue;
            }


            const p =
                getTouchPoint(
                    touch
                );


            const button =
                getTouchedButton(
                    p.x,
                    p.y
                );


            if (
                button
            ) {

                activeTouches.set(
                    touch.identifier,
                    button
                );

            }

            else {

                activeTouches.delete(
                    touch.identifier
                );
            }
        }


        updateTouchControls();

    },
    {
        passive: false
    }
);


// ============================================================
// Touch End
// ============================================================

canvas.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();


        for (
            const touch of
            e.changedTouches
        ) {

            activeTouches.delete(
                touch.identifier
            );
        }


        updateTouchControls();

    },
    {
        passive: false
    }
);


// ============================================================
// Touch Cancel
// ============================================================

canvas.addEventListener(
    "touchcancel",
    function(e) {

        e.preventDefault();


        for (
            const touch of
            e.changedTouches
        ) {

            activeTouches.delete(
                touch.identifier
            );
        }


        updateTouchControls();

    },
    {
        passive: false
    }
);


// ============================================================
// Mouse
// ============================================================

canvas.addEventListener(
    "mousedown",
    function(e) {

        e.preventDefault();


        startEngineSound();


        const button =
            getTouchedButton(
                e.offsetX,
                e.offsetY
            );


        if (
            button
        ) {

            activeTouches.set(
                "mouse",
                button
            );


            updateTouchControls();
        }
    }
);


canvas.addEventListener(
    "mousemove",
    function(e) {

        if (
            !e.buttons
        ) {

            return;
        }


        const button =
            getTouchedButton(
                e.offsetX,
                e.offsetY
            );


        if (
            button
        ) {

            activeTouches.set(
                "mouse",
                button
            );

        }

        else {

            activeTouches.delete(
                "mouse"
            );
        }


        updateTouchControls();
    }
);


window.addEventListener(
    "mouseup",
    function() {

        activeTouches.delete(
            "mouse"
        );

        updateTouchControls();
    }
);


// ============================================================
// لوحة المفاتيح
// ============================================================

window.addEventListener(
    "keydown",
    function(e) {

        startEngineSound();


        if (
            e.key === "ArrowLeft"
        ) {

            e.preventDefault();

            game.moveLeft = true;

            game.moveRight = false;
        }


        else if (
            e.key === "ArrowRight"
        ) {

            e.preventDefault();

            game.moveRight = true;

            game.moveLeft = false;
        }


        else if (
            e.key === "ArrowUp"
        ) {

            e.preventDefault();

            game.speedUpHeld = true;

            game.speedDownHeld = false;

            game.speedHoldTimer = 0;
        }


        else if (
            e.key === "ArrowDown"
        ) {

            e.preventDefault();

            game.speedDownHeld = true;

            game.speedUpHeld = false;

            game.speedHoldTimer = 0;
        }
    }
);


window.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight"
        ) {

            game.moveLeft = false;

            game.moveRight = false;
        }


        else if (
            e.key === "ArrowUp"
        ) {

            game.speedUpHeld = false;

            game.speedHoldTimer = 0;
        }


        else if (
            e.key === "ArrowDown"
        ) {

            game.speedDownHeld = false;

            game.speedHoldTimer = 0;
        }
    }
);


// ============================================================
// تغيير الحجم
// ============================================================

window.addEventListener(
    "resize",
    resize
);


window.addEventListener(
    "orientationchange",
    resize
);


if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "resize",
        resize
    );
}


// ============================================================
// بدء اللعبة
// ============================================================

resize();

resetWorld();

requestAnimationFrame(
    loop
);

</script>
