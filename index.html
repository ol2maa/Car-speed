<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>لعبة القيادة</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #78b85a;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}
body { position: fixed; }
canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, dpr = 1;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const game = {
    speed: 60,
    minSpeed: 0,
    maxSpeed: 300,
    speedStep: 10,

    distance: 0,
    maxDistance: 5,

    elapsed: 0,
    finished: false,

    playerX: 0,
    playerY: 0,
    carWidth: 54,
    carHeight: 82,

    roadWidth: 280,
    lineHeight: 45,
    lineGap: 45,
    lineSpacing: 90,
    lines: [],

    trees: [],
    traffic: [],

    moveLeft: false,
    moveRight: false,
    speedUp: false,
    speedDown: false,

    collisionLocked: false,
    collisionTimer: 0,
    collisionLockTime: 2,
    collisionCooldown: 0,
    flashTimer: 0,
    flashOn: true,

    lastTime: performance.now()
};

const trafficColors = [
    "#1976d2", "#f5c400", "#eeeeee",
    "#43a047", "#8e44ad", "#ff7043", "#00acc1"
];

function roadLeft() {
    return W / 2 - game.roadWidth / 2;
}

function roadRight() {
    return W / 2 + game.roadWidth / 2;
}

function playerY() {
    return H * 0.52;
}

function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
}

function rand(a, b) {
    return a + Math.random() * (b - a);
}

function makeTraffic(x, y, color, speed, lane) {
    return {
        x, y,
        width: 46,
        height: 72,
        color,
        baseSpeed: speed,
        currentSpeed: speed,
        lane,
        avoiding: false,
        timer: 0
    };
}

function resetWorld() {
    game.playerX = W / 2;
    game.playerY = playerY();

    game.lines = [];
    const count = Math.ceil(H / game.lineSpacing) + 5;
    for (let i = 0; i < count; i++) {
        game.lines.push(i * game.lineSpacing - 100);
    }

    game.trees = [];
    for (const side of [-1, 1]) {
        for (let y = -80; y < H + 200; y += 120) {
            game.trees.push(makeTree(side, y));
        }
    }

    game.traffic = [];
    const lanes = laneX();
    for (let i = 0; i < 7; i++) {
        const speedOptions = [
            rand(40, 70),
            rand(70, 110),
            rand(110, 160)
        ];
        const speed = speedOptions[Math.floor(Math.random() * speedOptions.length)];
        const lane = i % 3;
        game.traffic.push(
            makeTraffic(
                lanes[lane],
                200 + i * 180 + rand(-30, 30),
                trafficColors[i % trafficColors.length],
                speed,
                lane
            )
        );
    }
}

function laneX() {
    return [
        W / 2 - 75,
        W / 2,
        W / 2 + 75
    ];
}

function makeTree(side, y) {
    const x = W / 2 + side * (170 + rand(-20, 35));
    return {
        side,
        x,
        y,
        trunkW: 12,
        trunkH: 35
    };
}

resetWorld();

function roundedRect(x, y, w, h, r, fill, stroke, lineWidth = 1) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
    }
    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
    }
}

function drawTree(t) {
    ctx.fillStyle = "#7b4b27";
    ctx.fillRect(t.x - 6, t.y, 12, 35);

    ctx.beginPath();
    ctx.ellipse(t.x, t.y + 30, 24, 27.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#176b2c";
    ctx.fill();
}

function drawRoad() {
    ctx.fillStyle = "#78b85a";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#555555";
    ctx.fillRect(roadLeft(), 0, game.roadWidth, H);

    for (const y of game.lines) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(W / 2 - 4, y, 8, game.lineHeight);
    }

    for (const t of game.trees) drawTree(t);
}

function drawCar(x, y, w, h, color, angle = 0, player = false, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(angle);

    roundedRect(-w / 2, -h / 2, w, h, 8, color, "#ffffff", player ? 3 : 2);

    roundedRect(
        -(player ? 19 : 16),
        -h / 2 + 5,
        player ? 38 : 32,
        player ? 27 : 22,
        5,
        "#8ed0e8",
        "#333333",
        1
    );

    ctx.restore();
}

function drawUI() {
    // Distance box
    roundedRect(15, 17, 94, 42, 7, "#000000", "#ffffff", 1);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(game.distance.toFixed(3) + " كم", 62, 38);

    // Time box - ثابت باللون الأصفر
    roundedRect(15, 65, 94, 42, 7, "#000000", "#ffffff", 1);
    ctx.fillStyle = "#ffff00";
    ctx.font = "bold 13px Arial";
    ctx.fillText(formatTime(game.elapsed), 62, 86);

    // X
    ctx.fillStyle = "#ffffff";
    ctx.font = "42px Arial";
    ctx.fillText("×", W - 35, 35);

    // Speed on rear of player's car
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px Arial";
    ctx.shadowColor = "#000000";
    ctx.shadowOffsetY = -1;
    ctx.fillText(String(game.collisionLocked ? 0 : Math.floor(game.speed)), game.playerX, game.playerY + 28);
    ctx.shadowColor = "transparent";
    ctx.shadowOffsetY = 0;

    drawButton(W - 115, H - 155, "↓");
    drawButton(W - 45,  H - 155, "↑");
    drawButton(W - 115, H - 85,  "◀");
    drawButton(W - 45,  H - 85,  "▶");

    if (game.finished) {
        ctx.fillStyle = "rgba(0,0,0,0.72)";
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px Arial";
        ctx.fillText("تم إنهاء 5 كم", W / 2, H / 2 - 25);

        ctx.fillStyle = "#ffff00";
        ctx.font = "bold 22px Arial";
        ctx.fillText("الوقت: " + formatTime(game.elapsed), W / 2, H / 2 + 20);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Arial";
        ctx.fillText("اضغط X لإعادة اللعب", W / 2, H / 2 + 65);
    }
}

function drawButton(x, y, text) {
    roundedRect(x - 29, y - 29, 58, 58, 12, "#222222", "#ffffff", 2);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y + 1);
}

function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    const sec = seconds % 60;
    return String(minutes).padStart(2, "0") + ":" + sec.toFixed(2).padStart(5, "0");
}

function update(dt) {
    if (game.finished) return;

    if (game.collisionCooldown > 0) {
        game.collisionCooldown = Math.max(0, game.collisionCooldown - dt);
    }

    // الوقت يستمر حتى الوصول إلى 5 كم، ولا يتوقف بسبب التصادم
    game.elapsed += dt;

    // السرعة
    if (!game.collisionLocked) {
        if (game.speedUp) {
            game.speed = Math.min(game.maxSpeed, game.speed + game.speedStep * dt / 0.08);
        }
        if (game.speedDown) {
            game.speed = Math.max(game.minSpeed, game.speed - game.speedStep * dt / 0.08);
        }
        game.speed = Math.round(game.speed / game.speedStep) * game.speedStep;
    }

    if (game.speed <= 0) {
        game.speed = 0;
        game.moveLeft = false;
        game.moveRight = false;
    }

    // المسافة: السرعة كم/ساعة
    game.distance += game.speed * dt / 3600;

    if (game.distance >= game.maxDistance) {
        game.distance = game.maxDistance;
        game.finished = true;
        game.speed = 0;
        game.moveLeft = false;
        game.moveRight = false;
        game.speedUp = false;
        game.speedDown = false;
        return;
    }

    const motion = game.speed * 4;
    const move = motion * dt;

    // خطوط الطريق
    const totalSpan = game.lines.length * game.lineSpacing;
    for (let i = 0; i < game.lines.length; i++) {
        game.lines[i] -= move;
        if (game.lines[i] < -100) game.lines[i] += totalSpan;
    }

    // الأشجار
    for (const t of game.trees) {
        t.y -= move;
        if (t.y < -100) {
            t.y = H + rand(30, 150);
            t.x = W / 2 + t.side * (170 + rand(-20, 35));
        }
    }

    // سيارات المرور
    const lanes = laneX();

    for (const t of game.traffic) {
        if (!t.avoiding) t.currentSpeed = t.baseSpeed;

        t.timer += dt;
        if (t.timer > 5) {
            t.timer = 0;
            const change = rand(-0.08, 0.08);
            t.baseSpeed = clamp(t.baseSpeed * (1 + change), 30, 180);
        }

        let nearest = null;
        let nearestGap = Infinity;

        for (const other of game.traffic) {
            if (other === t || other.lane !== t.lane) continue;
            const gap = other.y - t.y;
            if (gap > 0 && gap < nearestGap) {
                nearestGap = gap;
                nearest = other;
            }
        }

        const safeGap = 130;

        if (nearest && nearestGap < safeGap) {
            t.avoiding = true;
            const factor = Math.max(0.3, (nearestGap - 50) / (safeGap - 50));
            t.currentSpeed = t.baseSpeed * factor;
        } else {
            t.avoiding = false;
            t.currentSpeed += (t.baseSpeed - t.currentSpeed) * Math.min(1, dt * 2);
        }

        const relativeSpeed = t.currentSpeed - game.speed;
        t.y += relativeSpeed * 4 * dt;

        if (t.y < -140) {
            let highestY = Math.max(...game.traffic.filter(o => o !== t).map(o => o.y));

            const laneCounts = lanes.map((_, laneIndex) =>
                game.traffic.filter(o =>
                    o !== t && o.lane === laneIndex && o.y > 0
                ).length
            );

            let newLane = laneCounts.indexOf(Math.min(...laneCounts));
            const speedOptions = [rand(40,70), rand(70,110), rand(110,160)];

            t.lane = newLane;
            t.baseSpeed = speedOptions[Math.floor(Math.random() * speedOptions.length)];
            t.currentSpeed = t.baseSpeed;
            t.avoiding = false;
            t.x = lanes[newLane];
            t.y = highestY + rand(260, 430);
        }
    }

    // التصادم
    if (!game.collisionLocked && game.collisionCooldown <= 0) {
        checkCollisions();
    }

    // التصادم: السيارة تتوقف فقط، بينما الوقت يستمر
    if (game.collisionLocked) {
        game.speed = 0;
        game.moveLeft = false;
        game.moveRight = false;

        game.collisionTimer -= dt;
        game.flashTimer += dt;

        if (game.flashTimer >= 0.15) {
            game.flashTimer = 0;
            game.flashOn = !game.flashOn;
        }

        if (game.collisionTimer <= 0) {
            game.collisionLocked = false;
            game.flashOn = true;
            game.collisionCooldown = 0.25;
        }
    }

    // التوجيه
    if (!game.collisionLocked && game.speed > 0) {
        let direction = 0;
        if (game.moveLeft) direction = -1;
        if (game.moveRight) direction = 1;

        const lateralSpeed = 190;
        let newX = game.playerX + direction * lateralSpeed * dt;

        const leftLimit = roadLeft() + game.carWidth / 2 + 5;
        const rightLimit = roadRight() - game.carWidth / 2 - 5;

        game.playerX = clamp(newX, leftLimit, rightLimit);
    }
}

function checkCollisions() {
    const px = game.playerX;
    const py = game.playerY;

    for (const t of game.traffic) {
        const dx = Math.abs(px - t.x);
        const dy = Math.abs(py - t.y);

        if (
            dx < 27 + 23 + 4 &&
            dy < 41 + 36 + 6
        ) {
            startCollision(t);
            return;
        }
    }
}

function startCollision(t) {
    game.speed = 0;
    game.collisionLocked = true;
    game.collisionTimer = game.collisionLockTime;
    game.flashTimer = 0;
    game.flashOn = true;
    game.moveLeft = false;
    game.moveRight = false;

    // إبعاد السيارة المصطدم بها قليلاً
    t.y += 95;
}

function draw() {
    drawRoad();

    // سيارات المرور
    for (const t of game.traffic) {
        drawCar(t.x, t.y, t.width, t.height, t.color);
    }

    // السيارة الرئيسية
    const alpha = game.collisionLocked && !game.flashOn ? 0.45 : 1;
    drawCar(game.playerX, game.playerY, 54, 82, "#e53935", 0, true, alpha);

    drawUI();
}

function loop(now) {
    let dt = (now - game.lastTime) / 1000;
    game.lastTime = now;

    if (!Number.isFinite(dt) || dt > 0.05) dt = 0.05;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

function pointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
    };
}

function buttonHit(x, y, cx, cy) {
    return Math.abs(x - cx) <= 34 && Math.abs(y - cy) <= 34;
}

function handleStart(x, y) {
    if (game.finished) {
        // X فقط لإعادة اللعبة
        if (x > W - 70 && y < 80) {
            restart();
        }
        return;
    }

    if (buttonHit(x, y, W - 115, H - 85)) {
        if (!game.collisionLocked && game.speed > 0) {
            game.moveLeft = true;
            game.moveRight = false;
        }
    } else if (buttonHit(x, y, W - 45, H - 85)) {
        if (!game.collisionLocked && game.speed > 0) {
            game.moveRight = true;
            game.moveLeft = false;
        }
    } else if (buttonHit(x, y, W - 45, H - 155)) {
        if (!game.collisionLocked) {
            game.speedUp = true;
            game.speedDown = false;
            game.speed = Math.min(game.maxSpeed, game.speed + game.speedStep);
        }
    } else if (buttonHit(x, y, W - 115, H - 155)) {
        if (!game.collisionLocked) {
            game.speedDown = true;
            game.speedUp = false;
            game.speed = Math.max(game.minSpeed, game.speed - game.speedStep);

            if (game.speed === 0) {
                game.moveLeft = false;
                game.moveRight = false;
            }
        }
    }
}

function handleMove(x, y) {
    if (game.finished || game.collisionLocked || game.speed <= 0) return;

    if (buttonHit(x, y, W - 115, H - 85)) {
        game.moveLeft = true;
        game.moveRight = false;
    } else if (buttonHit(x, y, W - 45, H - 85)) {
        game.moveRight = true;
        game.moveLeft = false;
    }
}

function handleEnd() {
    game.moveLeft = false;
    game.moveRight = false;
    game.speedUp = false;
    game.speedDown = false;
}

function restart() {
    game.speed = 60;
    game.distance = 0;
    game.elapsed = 0;
    game.finished = false;
    game.collisionLocked = false;
    game.collisionTimer = 0;
    game.collisionCooldown = 0;
    game.moveLeft = false;
    game.moveRight = false;
    game.speedUp = false;
    game.speedDown = false;
    game.playerX = W / 2;
    game.playerY = playerY();
    resetWorld();
}

canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const p = pointFromEvent(e);
    handleStart(p.x, p.y);
}, {passive: false});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const p = pointFromEvent(e);
    handleMove(p.x, p.y);
}, {passive: false});

canvas.addEventListener("touchend", e => {
    e.preventDefault();
    handleEnd();
}, {passive: false});

canvas.addEventListener("mousedown", e => {
    e.preventDefault();
    handleStart(e.offsetX, e.offsetY);
});

canvas.addEventListener("mousemove", e => {
    if (e.buttons) handleMove(e.offsetX, e.offsetY);
});

window.addEventListener("mouseup", handleEnd);

window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") {
        game.moveLeft = true;
        game.moveRight = false;
    } else if (e.key === "ArrowRight") {
        game.moveRight = true;
        game.moveLeft = false;
    } else if (e.key === "ArrowUp") {
        game.speedUp = true;
    } else if (e.key === "ArrowDown") {
        game.speedDown = true;
    }
});

window.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        game.moveLeft = false;
        game.moveRight = false;
    } else if (e.key === "ArrowUp") {
        game.speedUp = false;
    } else if (e.key === "ArrowDown") {
        game.speedDown = false;
    }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
