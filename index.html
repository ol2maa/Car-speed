<script>

"use strict";

// ============================================
// نظام الصوت - Web Audio API
// ============================================

class CarAudio {
    constructor() {
        this.audioCtx = null;
        this.gainNode = null;
        this.oscillator = null;
        this.filterNode = null;
        this.isPlaying = false;
        this.isInitialized = false;
        this.targetVolume = 0;
        this.currentVolume = 0;
        this.targetFrequency = 60;
        this.currentFrequency = 60;
        this.isEngineOn = false;
    }

    // تهيئة الصوت (يتم استدعاؤها عند أول لمسة)
    init() {
        if (this.isInitialized) return;
        
        try {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // عقدة التحكم بالصوت الرئيسية
            this.gainNode = this.audioCtx.createGain();
            this.gainNode.gain.value = 0;
            this.gainNode.connect(this.audioCtx.destination);
            
            // مرشح لتحسين الصوت
            this.filterNode = this.audioCtx.createBiquadFilter();
            this.filterNode.type = 'lowpass';
            this.filterNode.frequency.value = 800;
            this.filterNode.Q.value = 5;
            this.filterNode.connect(this.gainNode);
            
            // مذبذب أساسي
            this.oscillator = this.audioCtx.createOscillator();
            this.oscillator.type = 'sawtooth';
            this.oscillator.frequency.value = 60;
            this.oscillator.connect(this.filterNode);
            
            // مذبذب ثانوي لإضافة عمق للصوت
            this.oscillator2 = this.audioCtx.createOscillator();
            this.oscillator2.type = 'square';
            this.oscillator2.frequency.value = 30;
            this.oscillator2.connect(this.filterNode);
            
            // بدء المذبذبات
            this.oscillator.start();
            this.oscillator2.start();
            
            this.isInitialized = true;
            this.isEngineOn = true;
            
            console.log('🎵 نظام الصوت مهيأ');
        } catch (e) {
            console.warn('⚠️ تعذر تهيئة الصوت:', e);
        }
    }

    // تحديث الصوت بناءً على السرعة
    updateSpeed(speed) {
        if (!this.isInitialized) return;
        if (!this.isEngineOn) {
            this.targetVolume = 0;
            this.targetFrequency = 60;
            return;
        }
        
        // السرعة القصوى 300 كم/ساعة
        const normalizedSpeed = Math.min(speed / 300, 1);
        
        // الصوت: من 0 إلى 0.3 (منخفض لتجنب الإزعاج)
        this.targetVolume = normalizedSpeed * 0.25;
        
        // التردد: من 60 إلى 220 هرتز (محاكاة صوت محرك)
        this.targetFrequency = 60 + (normalizedSpeed * 160);
        
        // إذا كانت السرعة 0، صامت
        if (speed <= 0) {
            this.targetVolume = 0;
            this.targetFrequency = 60;
        }
    }

    // تشغيل المحرك
    startEngine() {
        if (!this.isInitialized) return;
        if (this.isEngineOn) return;
        
        this.isEngineOn = true;
        this.targetVolume = 0.1;
        this.targetFrequency = 70;
        
        // استئناف السياق الصوتي (لـ iPhone)
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }
    }

    // إيقاف المحرك
    stopEngine() {
        if (!this.isInitialized) return;
        this.isEngineOn = false;
        this.targetVolume = 0;
        this.targetFrequency = 60;
    }

    // تحديث تدريجي للصوت (يتم استدعاؤه في كل إطار)
    update(dt) {
        if (!this.isInitialized) return;
        
        // التحكم السلس في الصوت والتردد
        this.currentVolume += (this.targetVolume - this.currentVolume) * Math.min(1, dt * 8);
        this.currentFrequency += (this.targetFrequency - this.currentFrequency) * Math.min(1, dt * 8);
        
        // تحديث العقد
        if (this.gainNode) {
            this.gainNode.gain.value = this.currentVolume;
        }
        
        if (this.oscillator) {
            this.oscillator.frequency.value = this.currentFrequency;
        }
        
        if (this.oscillator2) {
            this.oscillator2.frequency.value = this.currentFrequency * 0.5;
        }
        
        // تحديث مرشح الصوت
        if (this.filterNode) {
            const freq = 200 + (this.currentFrequency * 3);
            this.filterNode.frequency.value = Math.min(freq, 2000);
        }
    }

    // تفعيل الصوت (لـ iPhone - يستدعى عند أول لمسة)
    activate() {
        this.init();
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }
        this.isEngineOn = true;
        this.targetVolume = 0.1;
        this.targetFrequency = 70;
    }
}

// إنشاء نظام الصوت
const carAudio = new CarAudio();

// ============================================
// Canvas
// ============================================

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let W = 0;
let H = 0;
let dpr = 1;


// ============================================
// تغيير حجم الشاشة
// ============================================

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    canvas.width =
        Math.floor(W * dpr);

    canvas.height =
        Math.floor(H * dpr);


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


// ============================================
// إعدادات اللعبة
// ============================================

const game = {

    // السرعة
    speed: 0,

    minSpeed: 0,

    maxSpeed: 300,

    speedStep: 10,

    speedMotion: 0,


    // المسافة
    distance: 0,

    maxDistance: 5,


    // الوقت
    elapsed: 0,


    // حالة اللعبة
    finished: false,

    // هل بدأت اللعبة؟
    started: false,


    // ========================================
    // السيارة الرئيسية
    // ========================================

    playerX: 0,

    playerY: 0,

    carWidth: 54,

    carHeight: 82,


    // ========================================
    // الطريق
    // ========================================

    roadWidth: 280,

    lineWidth: 8,

    lineHeight: 45,

    lineGap: 45,

    lineSpacing: 90,

    lines: [],


    // الأشجار
    trees: [],


    // ========================================
    // السيارات الأخرى
    // ========================================

    traffic: [],

    trafficCount: 7,

    trafficColors: [

        "#1976d2",

        "#f5c400",

        "#eeeeee",

        "#43a047",

        "#8e44ad",

        "#ff7043",

        "#00acc1"

    ],

    trafficLanes: [],


    // ========================================
    // التحكم
    // ========================================

    moveLeft: false,

    moveRight: false,


    speedUpHeld: false,

    speedDownHeld: false,

    speedHoldTimer: 0,

    speedHoldInterval: 0.08,


    // ========================================
    // التصادم
    // ========================================

    collisionLocked: false,

    collisionTimer: 0,

    collisionLockTime: 2,

    collisionCooldown: 0,


    flashTimer: 0,

    flashOn: true,


    savedCarX: 0,


    // دوران السيارة
    carRotation: 0,

    targetRotation: 0,


    lastTime:
        performance.now()
};


// ============================================
// حدود الطريق
// ============================================

function roadLeft() {

    return (
        W / 2 -
        game.roadWidth / 2
    );
}


function roadRight() {

    return (
        W / 2 +
        game.roadWidth / 2
    );
}


// ============================================
// مكان السيارة الرئيسي
// ============================================

function playerY() {

    return H - 110;
}


// ============================================
// دوال مساعدة
// ============================================

function clamp(v, a, b) {

    return Math.max(
        a,
        Math.min(b, v)
    );
}


function rand(a, b) {

    return (
        a +
        Math.random() *
        (b - a)
    );
}


function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    return (
        String(minutes)
            .padStart(2, "0")
        +
        ":"
        +
        sec
            .toFixed(2)
            .padStart(5, "0")
    );
}


// ============================================
// مستطيل دائري
// ============================================

function roundedRect(
    x,
    y,
    w,
    h,
    r,
    fill,
    stroke,
    lineWidth = 1
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        r
    );


    if (fill) {

        ctx.fillStyle =
            fill;

        ctx.fill();
    }


    if (stroke) {

        ctx.strokeStyle =
            stroke;

        ctx.lineWidth =
            lineWidth;

        ctx.stroke();
    }
}


// ============================================
// رسم شجرة
// ============================================

function drawTree(
    x,
    y
) {

    // الجذع
    ctx.fillStyle =
        "#7b4b27";

    ctx.fillRect(
        x - 6,
        y,
        12,
        35
    );


    // الشجرة
    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 30,
        24,
        27.5,
        0,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#176b2c";

    ctx.fill();
}


// ============================================
// رسم السيارة
// ============================================

function drawCar(
    x,
    y,
    w,
    h,
    color,
    angle = 0,
    isPlayer = false,
    alpha = 1
) {

    ctx.save();


    ctx.globalAlpha =
        alpha;


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        angle
    );


    // جسم السيارة
    roundedRect(
        -w / 2,
        -h / 2,
        w,
        h,
        8,
        color,
        "#ffffff",
        isPlayer ? 3 : 2
    );


    // النافذة
    const windowW =
        isPlayer ? 38 : 32;

    const windowH =
        isPlayer ? 27 : 22;


    roundedRect(
        -windowW / 2,
        -h / 2 + 5,
        windowW,
        windowH,
        5,
        "#8ed0e8",
        "#333333",
        1
    );


    ctx.restore();
}


// ============================================
// أزرار التحكم
// ============================================

function drawButton(
    x,
    y,
    text
) {

    roundedRect(
        x - 29,
        y - 29,
        58,
        58,
        12,
        "#222222",
        "#ffffff",
        2
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 30px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        text,
        x,
        y + 1
    );
}


// ============================================
// رسم الطريق
// ============================================

function drawRoad() {

    // العشب
    ctx.fillStyle =
        "#78b85a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // الطريق
    ctx.fillStyle =
        "#555555";

    ctx.fillRect(
        roadLeft(),
        0,
        game.roadWidth,
        H
    );


    // خطوط المنتصف
    for (
        const y of game.lines
    ) {

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            W / 2 -
            game.lineWidth / 2,
            y,
            game.lineWidth,
            game.lineHeight
        );
    }


    // الأشجار
    for (
        const t of game.trees
    ) {

        drawTree(
            t.x,
            t.y
        );
    }
}


// ============================================
// واجهة اللعبة
// ============================================

function drawUI() {

    // ========================================
    // المسافة
    // ========================================

    roundedRect(
        15,
        17,
        94,
        42,
        7,
        "#000000",
        "#ffffff",
        1
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        game.distance.toFixed(3) +
        " كم",
        62,
        38
    );


    // ========================================
    // الوقت
    // ========================================

    roundedRect(
        15,
        65,
        94,
        42,
        7,
        "#000000",
        "#ffffff",
        1
    );


    // أصفر
    ctx.fillStyle =
        "#ffff00";

    ctx.font =
        "bold 13px Arial";


    ctx.fillText(
        formatTime(
            game.elapsed
        ),
        62,
        86
    );


    // ========================================
    // زر X
    // ========================================

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "42px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "×",
        W - 35,
        35
    );


    // ========================================
    // السرعة
    // ========================================

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 18px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.shadowColor =
        "#000000";

    ctx.shadowOffsetY =
        -1;


    const speedText =
        game.collisionLocked
            ? "0"
            : String(
                Math.floor(
                    game.speed
                )
            );


    ctx.fillText(
        speedText,
        game.playerX,
        game.playerY + 28
    );


    ctx.shadowColor =
        "transparent";

    ctx.shadowOffsetY =
        0;


    // ========================================
    // أزرار التحكم
    // ========================================

    drawButton(
        W - 115,
        H - 155,
        "↓"
    );


    drawButton(
        W - 45,
        H - 155,
        "↑"
    );


    drawButton(
        W - 115,
        H - 85,
        "◀"
    );


    drawButton(
        W - 45,
        H - 85,
        "▶"
    );


    // ========================================
    // شاشة النهاية
    // ========================================

    if (game.finished) {

        ctx.fillStyle =
            "rgba(0,0,0,0.72)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 30px Arial";


        ctx.fillText(
            game.distance >=
            game.maxDistance
                ? "تم إنهاء 5 كم"
                : "تم إنهاء اللعبة",
            W / 2,
            H / 2 - 45
        );


        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "المسافة: " +
            game.distance.toFixed(3) +
            " كم",
            W / 2,
            H / 2
        );


        ctx.fillStyle =
            "#ffff00";

        ctx.font =
            "bold 22px Arial";


        ctx.fillText(
            "الوقت: " +
            formatTime(
                game.elapsed
            ),
            W / 2,
            H / 2 + 38
        );


        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "18px Arial";


        ctx.fillText(
            "اضغط X لإعادة اللعب",
            W / 2,
            H / 2 + 82
        );
    }
}


// ============================================
// إنشاء سيارة مرور
// ============================================

function createTrafficCar(
    x,
    y,
    color,
    speed,
    lane
) {

    return {

        x: x,

        y: y,

        width: 46,

        height: 72,

        color: color,

        baseSpeed: speed,

        currentSpeed: speed,

        lane: lane,

        avoiding: false,

        timer: 0
    };
}


// ============================================
// إنشاء شجرة
// ============================================

function createTree(
    side,
    y
) {

    const x =
        W / 2 +
        side *
        (
            170 +
            rand(-20, 35)
        );


    return {

        side: side,

        x: x,

        y: y
    };
}


// ============================================
// إعادة إنشاء العالم
// ============================================

function resetWorld() {

    // ========================================
    // السيارة الرئيسية
    // ========================================

    game.playerX =
        W / 2;


    game.playerY =
        playerY();


    game.carRotation =
        0;


    game.targetRotation =
        0;


    game.savedCarX =
        game.playerX;


    // ========================================
    // خطوط الطريق
    // ========================================

    game.lines = [];


    const lineCount =
        Math.ceil(
            H /
            game.lineSpacing
        ) + 4;


    for (
        let i = 0;
        i < lineCount;
        i++
    ) {

        game.lines.push(
            i *
            game.lineSpacing -
            100
        );
    }


    // ========================================
    // الأشجار
    // ========================================

    game.trees = [];


    for (
        const side of [-1, 1]
    ) {

        for (
            let y = -80;
            y < H + 200;
            y += 120
        ) {

            game.trees.push(
                createTree(
                    side,
                    y
                )
            );
        }
    }


    // ========================================
    // مسارات السيارات
    // ========================================

    game.trafficLanes = [

        W / 2 - 75,

        W / 2,

        W / 2 + 75
    ];


    // ========================================
    // السيارات الأخرى
    // ========================================

    game.traffic = [];


    for (
        let i = 0;
        i < game.trafficCount;
        i++
    ) {

        const speedOptions = [

            rand(20, 40),

            rand(40, 70),

            rand(70, 100)
        ];


        const speed =
            speedOptions[
                Math.floor(
                    Math.random() *
                    speedOptions.length
                )
            ];


        const lane =
            i % 3;


        const x =
            game.trafficLanes[
                lane
            ];


        const y =
            -200 -
            (i * 180) +
            rand(-30, 30);


        const color =
            game.trafficColors[
                i %
                game.trafficColors.length
            ];


        game.traffic.push(
            createTrafficCar(
                x,
                y,
                color,
                speed,
                lane
            )
        );
    }
}


// ============================================
// تحديث الصوت
// ============================================

function updateAudio() {
    // إذا كانت اللعبة منتهية أو متوقفة
    if (game.finished) {
        carAudio.stopEngine();
        return;
    }
    
    // إذا كان التصادم مقفلاً
    if (game.collisionLocked) {
        carAudio.stopEngine();
        return;
    }
    
    // إذا لم تبدأ اللعبة بعد (السرعة 0 ولم يتم الضغط على أي زر)
    if (!game.started && game.speed === 0) {
        carAudio.stopEngine();
        return;
    }
    
    // إذا بدأت اللعبة أو السرعة > 0
    if (game.started || game.speed > 0) {
        carAudio.startEngine();
        carAudio.updateSpeed(game.speed);
    } else {
        carAudio.stopEngine();
    }
}


// ============================================
// تحديث اللعبة
// ============================================

function update(dt) {

    if (dt > 0.05) {

        dt = 0.05;
    }


    // ========================================
    // تحديث الصوت (في كل إطار)
    // ========================================
    carAudio.update(dt);
    updateAudio();


    // ========================================
    // الوقت
    // ========================================

    if (!game.finished) {

        game.elapsed += dt;
    }


    // ========================================
    // تغيير السرعة
    // ========================================

    if (
        !game.collisionLocked &&
        !game.finished
    ) {

        if (
            game.speedUpHeld ||
            game.speedDownHeld
        ) {

            game.speedHoldTimer += dt;


            while (
                game.speedHoldTimer >=
                game.speedHoldInterval
            ) {

                game.speedHoldTimer -=
                    game.speedHoldInterval;


                if (
                    game.speedUpHeld &&
                    !game.speedDownHeld
                ) {

                    game.speed =
                        Math.min(
                            game.maxSpeed,
                            game.speed +
                            game.speedStep
                        );

                    // بدء المحرك عند أول زيادة في السرعة
                    if (game.speed > 0 && !game.started) {
                        game.started = true;
                        carAudio.startEngine();
                    }

                } else if (
                    game.speedDownHeld &&
                    !game.speedUpHeld
                ) {

                    game.speed =
                        Math.max(
                            game.minSpeed,
                            game.speed -
                            game.speedStep
                        );
                }


                game.speedMotion =
                    game.speed * 4;


                // عند السرعة صفر
                if (
                    game.speed <= 0
                ) {

                    game.speed = 0;

                    game.speedMotion = 0;

                    game.moveLeft = false;

                    game.moveRight = false;

                    game.carRotation = 0;
                    
                    // إيقاف الصوت عند السرعة 0
                    carAudio.stopEngine();
                }
            }
        }
    }


    // ========================================
    // حساب المسافة
    // ========================================

    if (!game.finished) {

        game.distance +=
            (
                game.speed *
                dt
            ) / 3600;


        // الوصول إلى 5 كم
        if (
            game.distance >=
            game.maxDistance
        ) {

            game.distance =
                game.maxDistance;


            game.finished = true;


            game.speed = 0;

            game.speedMotion = 0;


            game.moveLeft = false;

            game.moveRight = false;


            game.speedUpHeld = false;

            game.speedDownHeld = false;


            game.speedHoldTimer = 0;


            game.collisionLocked = false;
            
            // إيقاف الصوت
            carAudio.stopEngine();
        }
    }


    // ========================================
    // إذا انتهت اللعبة
    // ========================================

    if (game.finished) {

        game.speed = 0;

        game.speedMotion = 0;

        game.moveLeft = false;

        game.moveRight = false;

        game.speedUpHeld = false;

        game.speedDownHeld = false;

        game.speedHoldTimer = 0;

        return;
    }


    // ========================================
    // التصادم
    // ========================================

    if (
        game.collisionCooldown > 0
    ) {

        game.collisionCooldown =
            Math.max(
                0,
                game.collisionCooldown -
                dt
            );
    }


    if (
        game.collisionLocked
    ) {

        game.speed = 0;

        game.speedMotion = 0;


        game.collisionTimer -= dt;


        game.moveLeft = false;

        game.moveRight = false;


        game.playerX =
            game.savedCarX;


        // وميض السيارة
        game.flashTimer += dt;


        if (
            game.flashTimer >= 0.15
        ) {

            game.flashTimer = 0;

            game.flashOn =
                !game.flashOn;
        }


        // انتهاء فترة التصادم
        if (
            game.collisionTimer <= 0
        ) {

            game.collisionLocked =
                false;

            game.flashOn = true;


            game.collisionCooldown =
                0.25;


            game.carRotation = 0;

            game.targetRotation = 0;
            
            // إعادة تشغيل الصوت إذا كانت السرعة > 0
            if (game.speed > 0) {
                carAudio.startEngine();
            }
        }


        return;
    }


    // ========================================
    // حركة الطريق
    // ========================================

    const move =
        game.speedMotion * dt;


    const totalSpan =
        game.lines.length *
        game.lineSpacing;


    for (
        let i = 0;
        i < game.lines.length;
        i++
    ) {

        game.lines[i] += move;


        if (
            game.lines[i] >
            H + 100
        ) {

            game.lines[i] -=
                totalSpan;
        }
    }


    // ========================================
    // حركة الأشجار
    // ========================================

    for (
        const t of game.trees
    ) {

        t.y += move;


        if (
            t.y >
            H + 100
        ) {

            t.y =
                -100 +
                rand(-30, 30);


            t.x =
                W / 2 +
                t.side *
                (
                    170 +
                    rand(-20, 35)
                );
        }
    }


    // ========================================
    // حركة سيارات المرور
    // ========================================

    for (
        const t of game.traffic
    ) {

        if (!t.avoiding) {

            t.currentSpeed =
                t.baseSpeed;
        }


        t.timer += dt;


        if (
            t.timer > 5
        ) {

            t.timer = 0;


            const change =
                rand(
                    -0.08,
                    0.08
                );


            t.baseSpeed =
                clamp(
                    t.baseSpeed *
                    (1 + change),
                    20,
                    120
                );
        }


        // ========================================
        // تجنب السيارة الأمامية
        // ========================================

        let nearest = null;

        let nearestGap =
            Infinity;


        for (
            const other of game.traffic
        ) {

            if (
                other === t ||
                other.lane !== t.lane
            ) {

                continue;
            }


            const gap =
                other.y -
                t.y;


            if (
                gap > 0 &&
                gap < nearestGap
            ) {

                nearestGap =
                    gap;

                nearest =
                    other;
            }
        }


        const safeGap = 130;


        if (
            nearest &&
            nearestGap < safeGap
        ) {

            t.avoiding = true;


            const factor =
                Math.max(
                    0.3,
                    (
                        nearestGap -
                        50
                    ) /
                    (
                        safeGap -
                        50
                    )
                );


            t.currentSpeed =
                t.baseSpeed *
                factor;

        } else {

            t.avoiding = false;


            t.currentSpeed +=
                (
                    t.baseSpeed -
                    t.currentSpeed
                ) *
                Math.min(
                    1,
                    dt * 2
                );
        }


        // ========================================
        // السرعة النسبية
        // ========================================

        const relativeSpeed =
            game.speed -
            t.currentSpeed;


        t.y +=
            relativeSpeed *
            4 *
            dt;


        // ========================================
        // إعادة السيارة إلى أعلى الطريق
        // ========================================

        if (
            t.y >
            H + 140
        ) {

            let lowestY =
                Math.min(
                    ...game.traffic
                        .filter(
                            o => o !== t
                        )
                        .map(
                            o => o.y
                        )
                );


            const laneCounts =
                game.trafficLanes.map(
                    (_, laneIndex) =>

                        game.traffic.filter(
                            o =>
                                o !== t &&
                                o.lane ===
                                laneIndex &&
                                o.y < H
                        ).length
                );


            let newLane =
                laneCounts.indexOf(
                    Math.min(
                        ...laneCounts
                    )
                );


            const speedOptions = [

                rand(20, 40),

                rand(40, 70),

                rand(70, 100)
            ];


            t.lane =
                newLane;


            t.baseSpeed =
                speedOptions[
                    Math.floor(
                        Math.random() *
                        speedOptions.length
                    )
                ];


            t.currentSpeed =
                t.baseSpeed;


            t.avoiding = false;


            t.x =
                game.trafficLanes[
                    newLane
                ];


            t.y =
                lowestY -
                rand(260, 430);
        }
    }


    // ========================================
    // فحص التصادم
    // ========================================

    if (
        !game.collisionLocked &&
        game.collisionCooldown <= 0
    ) {

        checkCollisions();
    }


    // ========================================
    // تحريك السيارة يمين ويسار
    // ========================================

    if (
        game.speed > 0 &&
        !game.collisionLocked
    ) {

        if (
            game.moveLeft
        ) {

            game.targetRotation =
                -0.12;

        } else if (
            game.moveRight
        ) {

            game.targetRotation =
                0.12;

        } else {

            game.targetRotation =
                0;
        }


        const lateralSpeed =
            190;


        let direction = 0;


        if (
            game.moveLeft
        ) {

            direction = -1;
        }


        if (
            game.moveRight
        ) {

            direction = 1;
        }


        let newX =
            game.playerX +
            direction *
            lateralSpeed *
            dt;


        const leftLimit =
            roadLeft() +
            game.carWidth / 2 +
            5;


        const rightLimit =
            roadRight() -
            game.carWidth / 2 -
            5;


        game.playerX =
            clamp(
                newX,
                leftLimit,
                rightLimit
            );


        game.carRotation +=
            (
                game.targetRotation -
                game.carRotation
            ) *
            Math.min(
                1,
                dt * 10
            );

    } else {

        game.carRotation = 0;
    }
}


// ============================================
// فحص التصادم
// ============================================

function checkCollisions() {

    const px =
        game.playerX;

    const py =
        game.playerY;


    const pHalfW = 27;

    const pHalfH = 41;


    for (
        const t of game.traffic
    ) {

        const dx =
            Math.abs(
                px - t.x
            );


        const dy =
            Math.abs(
                py - t.y
            );


        const oHalfW = 23;

        const oHalfH = 36;


        if (
            dx <
                pHalfW +
                oHalfW +
                4
            &&
            dy <
                pHalfH +
                oHalfH +
                6
        ) {

            startCollision(t);

            return;
        }
    }
}


// ============================================
// بدء التصادم
// ============================================

function startCollision(t) {

    game.speed = 0;

    game.speedMotion = 0;


    game.collisionLocked =
        true;


    game.collisionTimer =
        game.collisionLockTime;


    game.flashTimer = 0;

    game.flashOn = true;


    game.moveLeft = false;

    game.moveRight = false;


    game.savedCarX =
        game.playerX;


    // إبعاد السيارة الأخرى
    t.y -= 95;
    
    // إيقاف الصوت عند التصادم
    carAudio.stopEngine();
}

    // ========================================
